name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild project structure
        run: |
          echo "--- Files in repo root ---"
          ls -la

          # Определяем пакет
          PKG=$(grep -oP 'package="\K[^"]+' AndroidManifest.xml || true)
          if [ -z "$PKG" ]; then
            PKG=$(grep -m1 -oP '^\s*package\s+\K[a-zA-Z0-9_.]+' MainActivity.kt || true)
          fi
          if [ -z "$PKG" ]; then
            PKG="com.example.asqachat"
          fi
          PKGPATH=${PKG//./\/}
          echo "Package: $PKG"

          mkdir -p app/src/main/java/$PKGPATH app/src/main/res/layout \
                  app/src/main/res/drawable app/src/main/res/values \
                  app/src/main/res/mipmap-anydpi-v26 app/src/main/res/mipmap-xxxhdpi

          mv AndroidManifest.xml app/src/main/
          mv *.kt app/src/main/java/$PKGPATH/ 2>/dev/null || true

          for f in activity_main.xml item_msg.xml bubble_mine.xml bubble_other.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/layout/
          done
          for f in button_gold.xml chip_active.xml chip_bg.xml edit_bg.xml ornament_tile.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/drawable/
          done
          [ -f ic_launcher.png ] && mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
          [ -f ic_launcher.xml ] && mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
          for f in colors.xml themes.xml strings.xml styles.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/values/
          done
          for f in *.xml; do
            [ -f "$f" ] && mv "$f" app/src/main/res/drawable/
          done

          printf '%s\n' \
            "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" \
            "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" \
            "include ':app'" \
            "rootProject.name = 'AsqaChat'" \
            > settings.gradle
          printf '%s\n' \
            "org.gradle.jvmargs=-Xmx2048m" \
            "android.useAndroidX=true" \
            > gradle.properties

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest
